<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RunLab - Test accesso protetto</title><style>body{background:#111317;color:#f0f0f0;font:17px system-ui,sans-serif;padding:24px;max-width:650px;margin:auto}h1{font-size:25px}button,input{font:inherit;box-sizing:border-box;border-radius:9px;padding:13px;margin:7px 0;width:100%}button{background:#d93639;color:white;border:0;font-weight:bold}input{background:#202329;border:1px solid #737780;color:white}pre{white-space:pre-wrap;background:#202329;padding:16px;border-radius:10px;overflow-wrap:anywhere}small{color:#b9bcc4}</style></head><body><h1>RunLab · Test accesso protetto</h1><p>Verifica che il Worker Cloudflare rifiuti le richieste non autorizzate e accetti il tuo token RunLab.</p><form id="form"><label for="token">RUNLAB_TOKEN (non la chiave Garmin)</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required><button type="submit">Verifica protezione</button></form><pre id="result" role="status">In attesa del test.</pre><small>Il token viene inviato esclusivamente al tuo Worker tramite HTTPS, non è salvato e non appare nel risultato. Nessun dato Garmin viene richiesto.</small><script>
const url='https://runlab-garmin.2001luca-finotti.workers.dev/auth-test';
const form=document.getElementById('form'),input=document.getElementById('token'),result=document.getElementById('result'),button=form.querySelector('button');
form.addEventListener('submit',async e=>{e.preventDefault();const token=input.value;input.value='';button.disabled=true;result.textContent='Verifica in corso…';try{const denied=await fetch(url,{cache:'no-store',credentials:'omit',redirect:'error'});if(denied.status!==401){result.textContent='Test interrotto: richiesta senza token, HTTP '+denied.status+' (atteso 401).';return;}const allowed=await fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store',credentials:'omit',redirect:'error'});let ok=false;if(allowed.status===200){try{ok=(await allowed.json()).authenticated===true}catch{}}result.textContent='Senza token: HTTP '+denied.status+' — accesso negato.\nCon token: HTTP '+allowed.status+' — '+(ok?'accesso autorizzato.\nTEST SUPERATO.':'test non superato: verifica token e configurazione.');}catch{result.textContent='Connessione non riuscita. Controlla che il Worker sia pubblicato e che consenta le richieste da GitHub Pages.';}finally{button.disabled=false;}});
</script></body></html>
