<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RunLab - Test connessione Garmin</title><style>body{background:#111317;color:#eee;font:18px system-ui;margin:0;padding:24px;max-width:600px;margin-inline:auto}h1{font-size:26px}label{display:block;margin:20px 0 8px}input,button,pre{box-sizing:border-box;width:100%;padding:16px;border-radius:12px;font:inherit}input{background:#202329;border:1px solid #777;color:#eee}button{background:#d93639;color:white;border:0;font-weight:bold;margin-top:16px}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202329}small{color:#aaa}</style></head><body><h1>RunLab · Connessione Garmin</h1><p>Verifica l'accesso alle ultime 10 attività senza visualizzare né salvare gli allenamenti.</p><label for="token">RUNLAB_TOKEN (non la chiave Garmin)</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="go">Test collegamento Garmin</button><pre id="result" aria-live="polite">In attesa del test.</pre><small>Il token RunLab viene inviato solo al tuo Worker tramite HTTPS. Non viene salvato.</small><script>
const input=document.getElementById('token'),btn=document.getElementById('go'),out=document.getElementById('result');
btn.onclick=async()=>{const token=input.value; if(!token){out.textContent='Inserisci il RUNLAB_TOKEN.';return;}input.value='';btn.disabled=true;out.textContent='Verifica in corso…';try{const r=await fetch('https://runlab-garmin.2001luca-finotti.workers.dev/garmin-check',{headers:{Authorization:'Bearer '+token},cache:'no-store',redirect:'error',signal:AbortSignal.timeout(45000)});const d=await r.json();if(r.ok&&d.connected===true&&Number.isInteger(d.activitiesReceived)){out.textContent='GARMIN COLLEGATO\nAutenticazione riuscita.\nAttività ricevute: '+d.activitiesReceived+' su massimo 10.\nNessun allenamento salvato.';}else{out.textContent='Test non riuscito.\nHTTP '+r.status+'\n'+(d.error||'Risposta inattesa')+(d.garminStatus?'\nHTTP Garmin: '+d.garminStatus:'')+(d.stage?'\nFase: '+d.stage:'');}}catch{out.textContent='Errore di rete o risposta non leggibile.';}finally{btn.disabled=false;}};
</script></body></html>
